<html>
    <head>
        <title>Rowspan and Columnspan Example</title>
    </head>
    <link rel="stylesheet" href="table.css">
    <body>
      <table>
        <tr>
        <th rowspan="2">Name</th>
        <th>Work</th>
        
      </tr>
      <td>Neymar</td>
      </tr>
      <tr>
        <td colspan="2">Messi</td>
      </tr>
    </table>
    </body>
</html>
